<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: без него env(safe-area-inset-*) всегда 0, и Safari
         letterbox'ит документ — рядом с вырезом в альбомной ориентации появлялась
         чёрная полоса поверх пергаментного героя. Отступы под вырез — в styles.css -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Casbah — алжирская кухня и халяль-шаурма в Санкт-Петербурге</title>
    <meta
      name="description"
      content="Ваш билет в мир кухни CASBAH: алжирская шаурма, тарелки и фалафель — всё халяль. Три кафе в Петербурге: Звонарёва 19/8, Лоскутная 15 и Стеклярусный переулок 3. 1 700+ оценок гостей."
    />
    <!-- тон строки состояния = верх пергаментного градиента героя (--parchment-hi) -->
    <meta name="theme-color" content="#F2E6C5" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Предзагружаем только кириллицу. rel=preload идёт с высшим приоритетом,
         впереди стилей и модуля, а латинская подрезка (20,5 КБ — 62% бюджета
         предзагрузки) на русской странице набирает лишь слово CASBAH в шапке:
         заблокировав её на Slow-4G, LCP падал с 2134 до 1658 мс. Первый визит
         всегда русский (lang.tsx читает язык из localStorage, html lang="ru"),
         у вернувшихся англоязычных обе подрезки уже в кеше. Латинская грузится
         обычным порядком из @font-face, а на время загрузки работает
         'Oranienbaum Fallback' с подогнанными метриками. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/oranienbaum-cyrillic-400-normal.woff2" crossorigin />

    <!-- PLACEHOLDER: после привязки домена замените og:image на абсолютный URL, добавьте og:url + canonical,
         а в JSON-LD ниже — поля "url" и "image" (абсолютные ссылки) во все три объекта Restaurant -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Casbah — алжирская кухня в Санкт-Петербурге" />
    <meta

    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
